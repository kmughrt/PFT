<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>肺功能檢查排班行事曆</title><style>
:root{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;color:#243248;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1220px;margin:auto;padding:22px}.panel{background:white;border:1px solid #dbe2ec;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 15px #23354b0b}h1{font-size:25px;margin:0 0 8px}.sub{color:#68788d;font-size:14px;margin-bottom:14px}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}select,button{font:inherit;padding:10px 13px;border:1px solid #c9d3e0;border-radius:8px;background:white;color:#25364d}button{cursor:pointer}button.primary{background:#344e71;color:white;border-color:#344e71}button:hover{filter:brightness(.95)}.stats{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}.stat{background:#edf2f8;border-radius:8px;padding:8px 13px;font-size:14px}.stat b{font-size:18px}.paper{background:white;border:1px solid #d3dbe5;padding:16px 14px 24px}.month{font-weight:800;font-size:23px;margin:0 0 9px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:2px solid #243346;border-left:2px solid #243346}.dow{background:#354d6d;color:white;text-align:center;font-size:21px;font-weight:700;border-right:1px solid #1c2a3d;border-bottom:2px solid #243346;padding:4px}.day{position:relative;min-height:115px;border-right:1px solid #243346;border-bottom:1px solid #243346;padding:5px 6px;cursor:pointer;background:#fff;display:flex;flex-direction:column}.day.weekend,.day.holiday{background:#b8c2d4}.day.empty{background:white;cursor:default}.day:hover:not(.empty){outline:3px solid #7197cb;outline-offset:-3px}.num{font-size:20px;line-height:1.1}.worker{font-weight:800;font-size:17px;min-height:25px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.worker.filled{background:#fff;padding:1px 2px}.lunar{font-size:12px;margin-top:auto;font-weight:600}.holiday-text{font-size:12px;font-weight:700}.foot{font-size:13px;color:#728094;margin-top:9px}.edit{position:fixed;inset:0;background:#13223785;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.edit.show{display:flex}.dialog{background:white;border-radius:14px;padding:22px;width:min(420px,100%);box-shadow:0 12px 45px #1115}.dialog h2{margin:0 0 14px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choices button{padding:15px 4px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}@media(max-width:700px){.wrap{padding:10px}.panel{padding:12px}.paper{padding:8px}.day{min-height:84px;padding:3px}.num{font-size:15px}.worker{font-size:12px;white-space:normal;line-height:1.2;margin-top:5px}.lunar,.holiday-text{font-size:10px}.dow{font-size:16px}}@media print{@page{size:A4 landscape;margin:9mm}body{background:white}.wrap{padding:0;max-width:none}.panel,.foot{display:none}.paper{border:0;padding:0}.month{font-size:19pt}.day{min-height:29mm;break-inside:avoid}.calendar{width:100%}.worker{font-size:13pt}.num{font-size:15pt}}
.batch{margin-top:15px;padding:12px;background:#eef3f8;border-radius:9px}.batch .controls{margin-top:8px}.pick{position:absolute;top:5px;right:6px;width:19px;height:19px;accent-color:#345e8b;cursor:pointer}.day.chosen{box-shadow:inset 0 0 0 3px #3979b8;background:#e2effb}.day.chosen.weekend,.day.chosen.holiday{background:#d1e2f3}.person{font-weight:700;border-color:#7894b4}.person:disabled,.batch button:disabled{opacity:.45;cursor:default}.num{padding-right:22px}@media(max-width:700px){.pick{width:15px;height:15px;right:2px;top:3px}.num{padding-right:16px}.batch button{padding:8px}}@media print{.pick{display:none}.day.chosen{box-shadow:none;background:white}.day.chosen.weekend,.day.chosen.holiday{background:#b8c2d4}.calendar{-webkit-print-color-adjust:exact;print-color-adjust:exact}.day{min-height:25mm}.day:hover{outline:none!important}}.report-title{font-size:32px;font-weight:800;text-align:center;margin:0 0 8px;color:#243248}.month{font-size:28px}.num{font-size:25px;font-weight:700}.worker{font-size:23px;min-height:30px}.lunar,.holiday-text{font-size:15px}.dow{font-size:25px}.controls button,.controls select{font-size:18px}.stat{font-size:17px}.day{min-height:125px}@media(max-width:700px){.report-title{font-size:23px}.month{font-size:22px}.num{font-size:19px}.worker{font-size:16px;overflow-wrap:anywhere}.lunar,.holiday-text{font-size:12px}.dow{font-size:19px}.day{min-height:96px}.controls button,.controls select{font-size:16px}}@media print{.report-title{font-size:24pt;color:#000;margin:0 0 2mm}.month{font-size:19pt;margin:0 0 2mm}.dow{font-size:18pt;padding:1mm}.day{min-height:24mm;padding:1mm 2mm}.num{font-size:17pt}.worker{font-size:19pt;min-height:0;margin-top:1mm;line-height:1.15}.lunar,.holiday-text{font-size:10pt;line-height:1.1}.paper{break-inside:avoid}.calendar{print-color-adjust:exact;-webkit-print-color-adjust:exact}.day.empty{min-height:24mm}}</style></head><body><main class="wrap"><section class="panel"><h1>肺功能檢查排班行事曆</h1><div class="sub">選擇月份，勾選多個日期，再點選人員姓名快速排班。</div><div class="controls"><button id="prev">◀ 上個月</button><select id="year" aria-label="年份"></select><select id="month" aria-label="月份"></select><button id="next">下個月 ▶</button><button class="primary" id="print">列印／另存 PDF</button><button id="jpg">匯出 JPG</button><button id="clear">清空本月排班</button></div><div class="batch"><strong id="pickedCount" aria-live="polite">已勾選 0 天</strong><div class="controls"><button id="allDays">全選日期</button><button id="workDays">勾選平日（週一至五）</button><button id="unpick">取消勾選</button></div><div class="controls" id="batchPeople"></div></div><div class="stats" id="stats"></div></section><section class="paper" id="paper"><div class="report-title">肺功能檢查人員班表</div><div class="month" id="title"></div><div class="calendar" id="calendar"></div><div class="foot">勾選日期後，按上方人員姓名即可批次填入；可再次勾選修改。</div></section></main><div class="edit" id="modal"><div class="dialog" role="dialog" aria-modal="true"><h2 id="editTitle">選擇排班人員</h2><div class="choices" id="choices"></div><div class="actions"><button id="remove">清除當日排班</button><button id="close">取消</button></div></div></div><script>
const people=['陳懷恩','翼昱嫈','葉睿豐','林佩樺'];const $=id=>document.getElementById(id);let y=2026,m=2,selected=null;const picked=new Set();const key=(yy,mm,dd)=>`pft-calendar-v1:${yy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;const get=(yy,mm,dd)=>localStorage.getItem(key(yy,mm,dd))||'';const put=(dd,name)=>{if(name)localStorage.setItem(key(y,m,dd),name);else localStorage.removeItem(key(y,m,dd));$('modal').classList.remove('show');render()};const lunarFmt=new Intl.DateTimeFormat('zh-TW-u-ca-chinese',{month:'long',day:'numeric'});function lunar(date){try{const parts=lunarFmt.formatToParts(date);const mon=parts.find(p=>p.type==='month')?.value||'';const d=parts.find(p=>p.type==='day')?.value||'';const n=parseInt(d,10);const names=['','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];return n===1?mon:names[n]||d}catch(e){return ''}}
const sample={2:'陳懷恩',3:'葉睿豐',4:'翼昱嫈',5:'陳懷恩',6:'林佩樺',9:'翼昱嫈',10:'翼昱嫈',11:'翼昱嫈',12:'林佩樺',13:'林佩樺',20:'林佩樺',23:'林佩樺',24:'葉睿豐',25:'葉睿豐',26:'陳懷恩',27:'陳懷恩'};if(!localStorage.getItem('pft-calendar-v1:sample-loaded')){Object.entries(sample).forEach(([d,n])=>localStorage.setItem(key(2026,2,+d),n));localStorage.setItem('pft-calendar-v1:sample-loaded','1')}
for(let i=2020;i<=2040;i++)$('year').add(new Option(`民國${i-1911}年`,i));for(let i=1;i<=12;i++)$('month').add(new Option(`${i}月`,i));function render(){ $('year').value=y;$('month').value=m;$('title').textContent=`${y-1911+0}年${m}月`;const cal=$('calendar');cal.replaceChildren();['一','二','三','四','五','六','日'].forEach(s=>{const el=document.createElement('div');el.className='dow';el.textContent=s;cal.append(el)});const first=(new Date(y,m-1,1).getDay()+6)%7;const days=new Date(y,m,0).getDate();const cells=Math.ceil((first+days)/7)*7;const counts=Object.fromEntries(people.map(n=>[n,0]));for(let i=0;i<cells;i++){const d=i-first+1;const el=document.createElement('div');el.className='day';if(d<1||d>days){el.classList.add('empty');cal.append(el);continue}const date=new Date(y,m-1,d);const wd=date.getDay();if(wd===0||wd===6)el.classList.add('weekend');const name=get(y,m,d);if(counts[name]!==undefined)counts[name]++;const num=document.createElement('div');num.className='num';num.textContent=d;el.append(num);const worker=document.createElement('div');worker.className='worker'+(name?' filled':'');worker.textContent=name;el.append(worker);const ln=document.createElement('div');ln.className='lunar';ln.textContent=lunar(date);el.append(ln);if(y===2026&&m===2&&[16,17,18,19,20,27].includes(d)){el.classList.add('holiday');}if(y===2026&&m===2&&d===16){el.classList.add('holiday');const t=document.createElement('div');t.className='holiday-text';t.textContent='除夕';el.append(t)}const ck=document.createElement('input');ck.type='checkbox';ck.className='pick';ck.checked=picked.has(d);ck.setAttribute('aria-label',`${m}月${d}日`);el.classList.toggle('chosen',ck.checked);function toggle(){if(ck.checked)picked.add(d);else picked.delete(d);el.classList.toggle('chosen',ck.checked);updatePicked()}ck.onclick=e=>e.stopPropagation();ck.onchange=toggle;el.append(ck);el.onclick=()=>{ck.checked=!ck.checked;toggle()};cal.append(el)}$('stats').replaceChildren();people.forEach(n=>{const e=document.createElement('div');e.className='stat';e.textContent=n+'：';const b=document.createElement('b');b.textContent=counts[n]+' 天';e.append(b);$('stats').append(e)});updatePicked()}
people.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>put(selected,n);$('choices').append(b)});$('remove').onclick=()=>put(selected,'');$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};function change(offset){picked.clear();const d=new Date(y,m-1+offset,1);y=d.getFullYear();m=d.getMonth()+1;render()}$('prev').onclick=()=>change(-1);$('next').onclick=()=>change(1);$('year').onchange=e=>{picked.clear();y=+e.target.value;render()};$('month').onchange=e=>{picked.clear();m=+e.target.value;render()};$('print').onclick=()=>window.print();$('clear').onclick=()=>{if(confirm(`確定清空民國${y-1911}年${m}月的所有排班？`)){for(let d=1;d<=new Date(y,m,0).getDate();d++)localStorage.removeItem(key(y,m,d));picked.clear();render()}};
$('jpg').onclick=()=>{const W=1600,margin=28,head=104,header=46,cellH=146;const first=(new Date(y,m-1,1).getDay()+6)%7;const days=new Date(y,m,0).getDate();const rows=Math.ceil((first+days)/7);const canvas=document.createElement('canvas');canvas.width=W;canvas.height=margin*2+head+header+rows*cellH;const c=canvas.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,W,canvas.height);c.fillStyle='#1f2c3c';c.font='bold 34px Microsoft JhengHei,sans-serif';c.textAlign='center';c.font='bold 46px Microsoft JhengHei,sans-serif';c.fillText('肺功能檢查人員班表',W/2,margin+43);c.textAlign='left';c.font='bold 34px Microsoft JhengHei,sans-serif';c.fillText(`${y-1911}年${m}月`,margin,margin+90);const cw=(W-margin*2)/7;['一','二','三','四','五','六','日'].forEach((t,i)=>{const x=margin+i*cw;c.fillStyle='#354d6d';c.fillRect(x,margin+head,cw,header);c.fillStyle='white';c.font='bold 28px sans-serif';c.textAlign='center';c.fillText(t,x+cw/2,margin+head+32)});c.textAlign='left';for(let i=0;i<rows*7;i++){const d=i-first+1,col=i%7,row=Math.floor(i/7),x=margin+col*cw,yy=margin+head+header+row*cellH;const weekend=col>=5;c.fillStyle=(d>=1&&d<=days&&(weekend||(y===2026&&m===2&&[16,17,18,19,20,27].includes(d))))?'#b8c2d4':'#fff';c.fillRect(x,yy,cw,cellH);c.strokeStyle='#243346';c.lineWidth=1.5;c.strokeRect(x,yy,cw,cellH);if(d<1||d>days)continue;c.fillStyle='#1f2735';c.font='bold 32px sans-serif';c.fillText(d,x+8,yy+31);const n=get(y,m,d);if(n){c.fillStyle='#fff';c.fillRect(x+5,yy+43,cw-10,36);c.fillStyle='#1b2737';c.font='bold 34px Microsoft JhengHei,sans-serif';c.fillText(n,x+8,yy+70)}c.fillStyle='#1f2735';c.font='21px Microsoft JhengHei,sans-serif';c.fillText(lunar(new Date(y,m-1,d)),x+8,yy+cellH-10)}const a=document.createElement('a');a.download=`肺功能班表_${y}${String(m).padStart(2,'0')}.jpg`;a.href=canvas.toDataURL('image/jpeg',.94);a.click()};
function updatePicked(){ $('pickedCount').textContent=`已勾選 ${picked.size} 天`;document.querySelectorAll('#batchPeople button').forEach(b=>b.disabled=!picked.size); }
function applyBatch(name){if(!picked.size)return;const overwrite=[...picked].filter(d=>get(y,m,d)&&get(y,m,d)!==name);if(overwrite.length&&!confirm(`將${name?'更改':'清除'} ${overwrite.length} 天已有的排班，確定嗎？`))return;for(const d of picked){if(name)localStorage.setItem(key(y,m,d),name);else localStorage.removeItem(key(y,m,d));}picked.clear();render();}
for(const n of people){const b=document.createElement('button');b.className='person';b.textContent=n;b.onclick=()=>applyBatch(n);$('batchPeople').append(b)}const erase=document.createElement('button');erase.textContent='清除勾選日期排班';erase.onclick=()=>applyBatch('');$('batchPeople').append(erase);
function selectDays(weekdays){picked.clear();for(let d=1;d<=new Date(y,m,0).getDate();d++){const w=new Date(y,m-1,d).getDay();if(!weekdays||(w>0&&w<6))picked.add(d)}render()}
$('allDays').onclick=()=>selectDays(false);$('workDays').onclick=()=>selectDays(true);$('unpick').onclick=()=>{picked.clear();render()};render();
</script></body></html>
